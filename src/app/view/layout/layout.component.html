<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="sidebar" style="overflow: auto;">
  <div class="sidebar-header">
    <img src="calendar.png" alt="Logo">
    <h4 class="text-center typing-effect">Gestion des emplois du temps</h4>
  </div>
  <div class="sidebar-menu">
    <!-- Dashboard - accessible à tous -->
    <a routerLink="/dashbord" routerLinkActive="active" class="sparkle">
      <i class="fas fa-home"></i> Dashboard
    </a>

    <!-- Menu Enseignant - accessible à tous -->
    <a *ngIf="hasAccess('enseignants')" routerLink="/enseignants" routerLinkActive="active" class="sparkle">
      <i class="fas fa-chalkboard-teacher"></i> Enseignant
    </a>

    <!-- Menu Cours - accessible à tous -->
    <a *ngIf="hasAccess('cours')" routerLink="/cours" routerLinkActive="active" class="sparkle">
      <i class="fas fa-book"></i> Cours
    </a>

    <!-- Menu Salle - restreint pour ADMINISTRATION -->
    <a *ngIf="hasAccess('salles')" routerLink="/salles" routerLinkActive="active" class="sparkle">
      <i class="fas fa-door-open"></i> Salle
    </a>

    <!-- Menu Filière - restreint pour ADMINISTRATION -->
    <a *ngIf="hasAccess('filieres')" routerLink="/filieres" routerLinkActive="active" class="sparkle">
      <i class="fas fa-graduation-cap"></i> Filière
    </a>

    <!-- Menu Classes - accessible à tous -->
    <a *ngIf="hasAccess('classes')" routerLink="/classes" routerLinkActive="active" class="sparkle">
      <i class="fas fa-graduation-cap"></i> Classes
    </a>

    <!-- Menu Séances - accessible à tous -->
    <a *ngIf="hasAccess('creation-seances')" routerLink="/creation-seances" routerLinkActive="active" class="sparkle">
      <i class="fas fa-calendar-plus"></i> Création des Séances
    </a>

    <a *ngIf="hasAccess('emploi-du-temps')" routerLink="/emploi-du-temps" routerLinkActive="active" class="sparkle">
      <i class="fas fa-calendar-week"></i> Emploi du Temps
    </a>

    <!-- Menu Étudiant - accessible à tous -->
    <a *ngIf="hasAccess('etudiant')" routerLink="/etudiant" routerLinkActive="active" class="sparkle">
      <i class="fas fa-user-graduate"></i> Étudiant
    </a>

    <!-- Menu Administration - restreint pour ADMINISTRATION -->
    <a *ngIf="hasAccess('administration')" routerLink="/administration" routerLinkActive="active" class="sparkle">
      <i class="fas fa-building"></i> Membre de l'administration
    </a>

    <!-- Menu Comptes en attente - restreint pour ADMINISTRATION -->
    <a *ngIf="hasAccess('validation-comptes')" routerLink="/validation-comptes" routerLinkActive="active" class="sparkle">
      <i class="fas fa-building"></i> Comptes en attentes
    </a>

    <!-- Menu Utilisateurs - restreint pour ADMINISTRATION -->
    <a *ngIf="hasAccess('utilisateurs')" routerLink="/utilisateurs" routerLinkActive="active" class="sparkle">
      <i class="fas fa-building"></i> Utilisateurs
    </a>

    <!-- Menu Parents - restreint pour ADMINISTRATION -->
    <a *ngIf="hasAccess('parent')" routerLink="/parent" routerLinkActive="active" class="sparkle">
      <i class="fas fa-building"></i> Parents
    </a>

    <a href="javascript:void(0)" (click)="onLogoff()" class="sparkle">
      <i class="fas fa-sign-out-alt"></i> Déconnexion
    </a>
  </div>
</div>

<div class="content">
  <router-outlet></router-outlet>
</div>
